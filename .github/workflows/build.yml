name: Build

on:
  push:
    tags: ['v*']
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: AdvBoxExport-linux.tar.gz
          - os: macos-latest
            artifact_name: AdvBoxExport-macos.zip
          - os: windows-latest
            artifact_name: AdvBoxExport-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[build]"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run pyinstaller \
            --noconfirm \
            --windowed \
            --name AdvBoxExport \
            --collect-all qt_material \
            advbox_export/__main__.py
          cd dist
          tar -czf ../AdvBoxExport-linux.tar.gz AdvBoxExport

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run pyinstaller \
            --noconfirm \
            --windowed \
            --name AdvBoxExport \
            --collect-all qt_material \
            advbox_export/__main__.py
          cd dist
          zip -ry ../AdvBoxExport-macos.zip AdvBoxExport.app

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run pyinstaller `
            --noconfirm `
            --windowed `
            --name AdvBoxExport `
            --collect-all qt_material `
            advbox_export/__main__.py
          Compress-Archive -Path dist\AdvBoxExport -DestinationPath AdvBoxExport-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
