name: Build

on:
  push:
    tags: ['v*']
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: AdvBoxExport-linux.tar.gz
          - os: macos-latest
            artifact_name: AdvBoxExport-macos.dmg
          - os: windows-latest
            artifact_name: AdvBoxExport-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[build]"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run pyinstaller \
            --noconfirm \
            --windowed \
            --name AdvBoxExport \
            --add-data "advbox_export/ui/styles.qss:advbox_export/ui" \
            --add-data "advbox_export/ui/styles_dark.qss:advbox_export/ui" \
            --add-data "advbox_export/ui/fonts:advbox_export/ui/fonts" \
            --add-data "advbox_export/ui/icons:advbox_export/ui/icons" \
            advbox_export/__main__.py
          cd dist
          tar -czf ../AdvBoxExport-linux.tar.gz AdvBoxExport

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run pyinstaller \
            --noconfirm \
            --windowed \
            --name AdvBoxExport \
            --add-data "advbox_export/ui/styles.qss:advbox_export/ui" \
            --add-data "advbox_export/ui/styles_dark.qss:advbox_export/ui" \
            --add-data "advbox_export/ui/fonts:advbox_export/ui/fonts" \
            --add-data "advbox_export/ui/icons:advbox_export/ui/icons" \
            advbox_export/__main__.py

          # Ad-hoc signing: evita "app is damaged" em macOS recentes mesmo sem
          # Apple Developer ID. Não dispensa o passo de quarantine na 1ª abertura.
          codesign --force --deep --sign - dist/AdvBoxExport.app

          # Layout do DMG: app + atalho Aplicativos + script de primeiro uso
          mkdir -p dmg-staging
          cp -R dist/AdvBoxExport.app dmg-staging/
          cp packaging/macos/primeiro-uso.command dmg-staging/
          chmod +x dmg-staging/primeiro-uso.command

          create-dmg \
            --volname "AdvBox Export" \
            --window-pos 200 120 \
            --window-size 640 420 \
            --icon-size 96 \
            --icon "AdvBoxExport.app" 160 180 \
            --hide-extension "AdvBoxExport.app" \
            --app-drop-link 480 180 \
            --icon "primeiro-uso.command" 320 320 \
            --no-internet-enable \
            AdvBoxExport-macos.dmg \
            dmg-staging/

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run pyinstaller `
            --noconfirm `
            --windowed `
            --name AdvBoxExport `
            --add-data "advbox_export/ui/styles.qss;advbox_export/ui" `
            --add-data "advbox_export/ui/styles_dark.qss;advbox_export/ui" `
            --add-data "advbox_export/ui/fonts;advbox_export/ui/fonts" `
            --add-data "advbox_export/ui/icons;advbox_export/ui/icons" `
            advbox_export/__main__.py
          Compress-Archive -Path dist\AdvBoxExport -DestinationPath AdvBoxExport-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
