name: Build

on:
  push:
    tags: ['v*']
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: AdvBoxExport-linux.deb
          - os: macos-latest
            artifact_name: AdvBoxExport-macos.dmg
          - os: windows-latest
            artifact_name: AdvBoxExport-Setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[build]"

      - name: Read version from pyproject (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/version\s*=\s*"([^"]+)"/\1/')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Read version from pyproject (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run pyinstaller \
            --noconfirm \
            --windowed \
            --name AdvBoxExport \
            --add-data "advbox_export/ui/styles.qss:advbox_export/ui" \
            --add-data "advbox_export/ui/styles_dark.qss:advbox_export/ui" \
            --add-data "advbox_export/ui/fonts:advbox_export/ui/fonts" \
            --add-data "advbox_export/ui/icons:advbox_export/ui/icons" \
            advbox_export/__main__.py
          bash packaging/linux/build-deb.sh "$APP_VERSION"

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Generate ICNS (macOS)
        if: runner.os == 'macOS'
        run: |
          # iconutil vem com Xcode CLI tools (sempre presente no runner macOS)
          ICONSET=packaging/icons/AdvBoxExport.iconset
          rm -rf "$ICONSET" && mkdir -p "$ICONSET"
          cp packaging/icons/icon-16.png   "$ICONSET/icon_16x16.png"
          cp packaging/icons/icon-32.png   "$ICONSET/icon_16x16@2x.png"
          cp packaging/icons/icon-32.png   "$ICONSET/icon_32x32.png"
          cp packaging/icons/icon-64.png   "$ICONSET/icon_32x32@2x.png"
          cp packaging/icons/icon-128.png  "$ICONSET/icon_128x128.png"
          cp packaging/icons/icon-256.png  "$ICONSET/icon_128x128@2x.png"
          cp packaging/icons/icon-256.png  "$ICONSET/icon_256x256.png"
          cp packaging/icons/icon-512.png  "$ICONSET/icon_256x256@2x.png"
          cp packaging/icons/icon-512.png  "$ICONSET/icon_512x512.png"
          cp packaging/icons/icon-1024.png "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o packaging/icons/AdvBoxExport.icns
          rm -rf "$ICONSET"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run pyinstaller \
            --noconfirm \
            --windowed \
            --name AdvBoxExport \
            --icon packaging/icons/AdvBoxExport.icns \
            --add-data "advbox_export/ui/styles.qss:advbox_export/ui" \
            --add-data "advbox_export/ui/styles_dark.qss:advbox_export/ui" \
            --add-data "advbox_export/ui/fonts:advbox_export/ui/fonts" \
            --add-data "advbox_export/ui/icons:advbox_export/ui/icons" \
            advbox_export/__main__.py

          # Ad-hoc signing: evita "app is damaged" em macOS recentes mesmo sem
          # Apple Developer ID. Não dispensa o passo de quarantine na 1ª abertura.
          codesign --force --deep --sign - dist/AdvBoxExport.app

          # Layout do DMG: app + atalho Aplicativos + script de primeiro uso
          mkdir -p dmg-staging
          cp -R dist/AdvBoxExport.app dmg-staging/
          cp packaging/macos/primeiro-uso.command dmg-staging/
          chmod +x dmg-staging/primeiro-uso.command

          create-dmg \
            --volname "AdvBox Export" \
            --window-pos 200 120 \
            --window-size 640 420 \
            --icon-size 96 \
            --icon "AdvBoxExport.app" 160 180 \
            --hide-extension "AdvBoxExport.app" \
            --app-drop-link 480 180 \
            --icon "primeiro-uso.command" 320 320 \
            --no-internet-enable \
            AdvBoxExport-macos.dmg \
            dmg-staging/

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run pyinstaller `
            --noconfirm `
            --windowed `
            --name AdvBoxExport `
            --icon packaging/icons/AdvBoxExport.ico `
            --add-data "advbox_export/ui/styles.qss;advbox_export/ui" `
            --add-data "advbox_export/ui/styles_dark.qss;advbox_export/ui" `
            --add-data "advbox_export/ui/fonts;advbox_export/ui/fonts" `
            --add-data "advbox_export/ui/icons;advbox_export/ui/icons" `
            advbox_export/__main__.py
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:APP_VERSION" `
            packaging\windows\AdvBoxExport.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*.exe' \) -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
