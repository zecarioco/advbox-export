[project]
name = "advbox-export"
version = "0.1.0"
description = "Exportador de atividades da AdvBox com UI desktop"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "qt-material>=2.14",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
advbox-export = "advbox_export.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["advbox_export*"]
